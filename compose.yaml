services:
  workshop:
    image: rospin-so101-workshop:cpu
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - type: volume
        source: workshop-data
        target: /workspace/data
      - ./trajectories:/workspace/trajectories:ro
    environment:
      MUJOCO_GL: osmesa
      ROSPIN_DATA_ROOT: /workspace/data
      ROSPIN_TASKS_DIR: /workspace/tasks
      ROSPIN_TRAJECTORIES_DIR: /workspace/trajectories
      ROSPIN_CONTROL_HZ: "60"
      ROSPIN_CAMERA_HZ: "25"
      ROSPIN_IMAGE_WIDTH: "640"
      ROSPIN_IMAGE_HEIGHT: "480"

volumes:
  workshop-data:
    name: ${ROSPIN_DATA_VOLUME_NAME:-rospin-workshop-data}
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROSPIN_HOST_DATA_DIR:-./data}

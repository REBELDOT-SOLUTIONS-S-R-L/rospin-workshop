services:
  workshop:
    image: rospin-so101-workshop:cpu
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    init: true
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data
    environment:
      MUJOCO_GL: osmesa
      ROSPIN_DATA_ROOT: /workspace/data
      ROSPIN_CONTROL_HZ: "20"
      ROSPIN_CAMERA_HZ: "5"
      ROSPIN_IMAGE_WIDTH: "320"
      ROSPIN_IMAGE_HEIGHT: "240"

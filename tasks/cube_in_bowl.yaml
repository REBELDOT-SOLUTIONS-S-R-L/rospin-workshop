schema_version: 1
id: cube_in_bowl
title: Put the green cube in the bowl
instruction: Pick up the green cube and place it inside the black bowl.

objects:
  - name: cube
    catalog_id: cube_green_usd
    pose:
      position: [-0.06, 0.135, 0.767903]
      quaternion: [1, 0, 0, 0]
    spawn:
      x: [-0.15, 0.03]
      y: [0.07, 0.20]

  - name: bowl
    catalog_id: bowl_oala_usd
    pose:
      position: [-0.2833, 0.029, 0.7601]
      quaternion: [1, 0, 0, 0]

success:
  hold_seconds: 2.0
  conditions:
    - type: object_fully_inside_region
      object: cube
      region: bowl.interior
    - type: gripper_open
      minimum_fraction: 0.8
    - type: body_speed_below
      object: cube
      linear_mps: 0.05
      angular_rps: 0.5

episode:
  timeout_seconds: 20

dataset:
  description: Put the green cube into the black bowl

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rospin-workshop"
version = "0.1.0"
description = "Workshop-ready SO-101 simulation, browser teleoperation, and LeRobot v3 recording"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "av==15.0.0",
  "fastapi==0.116.1",
  "gymnasium==1.3.0",
  "lerobot[feetech,training]==0.6.0",
  "mujoco==3.11.0",
  "numpy==2.2.6",
  "opencv-python-headless==4.13.0.92",
  "PyYAML==6.0.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "usd-core==26.8",
]

[project.scripts]
rospin-serve = "rospin_workshop.web_app:main"
rospin-train-act = "rospin_workshop.train_act:main"
rospin-check-dataset = "rospin_workshop.dataset_tools:main"
rospin-self-check = "rospin_workshop.self_check:main"
rospin-generate = "rospin_workshop.trajectory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rospin_workshop = ["models/*.xml", "models/*.json", "web/*.html"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
